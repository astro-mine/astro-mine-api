apiVersion: v1
kind: Service
metadata:
  name: {{ include "astro-mine-api.fullname" . }}
  labels:
    {{- include "astro-mine-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "astro-mine-api.selectorLabels" . | nindent 4 }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "astro-mine-api.fullname" . }}
  labels:
    {{- include "astro-mine-api.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "astro-mine-api.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "astro-mine-api.fullname" . }}
  labels:
    {{- include "astro-mine-api.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "astro-mine-api.selectorLabels" . | nindent 6 }}
  endpoints:
    # Bench is the only surface exposing a Prometheus endpoint today (bench.md §10). When another
    # does, add an entry here rather than widening this path.
    - port: http
      path: /bench/metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
